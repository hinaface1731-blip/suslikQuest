<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1410">
  <meta name="description" content="Пиксельный квест-викторина: спаси десять бронзовых сусликов Красноярска от Крота Кромешника и узнай историю города.">
  <title>Суслики Красного Яра</title>
  <link rel="icon" href="assets/sprites/nazar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="console">
    <header class="hud">
      <button id="logo" class="logo" title="В главное меню">Суслики<br><span>Красного Яра</span></button>
      <div id="wordbar" class="wordbar"></div>
      <nav class="nav">
        <button id="btn-map" class="icon-btn" title="Карта" aria-label="Карта"><i class="ic ic-map"></i></button>
        <button id="btn-album" class="icon-btn" title="Альбом краеведа" aria-label="Альбом краеведа"><i class="ic ic-book"></i></button>
        <button id="btn-sound" class="icon-btn" aria-label="Звук"><i class="ic ic-sound"></i></button>
      </nav>
    </header>
    <main id="app" class="screen"><p class="loading">Загрузка…</p></main>
  </div>
  <div id="fade" aria-hidden="true"></div>
  <noscript>Для игры нужен JavaScript.</noscript>
  <script src="js/story.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
